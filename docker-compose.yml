version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: doc_search_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doc_search_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doc_search_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: doc_search_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: doc_search_db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
